services:
  demo:
    build: .
    ports:
      - "7860:7860"
    volumes:
      - ./data:/app/data:ro
      - ./outputs:/app/outputs
    command: python app.py

  train:
    build: .
    volumes:
      - ./data:/app/data:ro
      - ./outputs:/app/outputs
    command: python train_model.py
